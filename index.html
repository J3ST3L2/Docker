<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hosted Apps</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Home Lab</p>
          <h1>Hosted Apps</h1>
        </div>
        <div class="search-wrap">
          <label class="sr-only" for="search">Search apps</label>
          <input id="search" type="search" placeholder="Search apps" autocomplete="off" />
        </div>
      </header>

      <section class="status-strip" aria-label="Network shortcuts">
        <a href="https://nms.jestertek.cc" data-link="nms">NMS</a>
        <a href="https://pve.jestertek.cc" data-link="pve">Proxmox</a>
        <a href="https://npm.jestertek.cc" data-link="npm">Proxy</a>
      </section>

      <section>
        <div class="section-head">
          <h2>Quick Links</h2>
          <span id="count"></span>
        </div>
        <div id="apps" class="app-grid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

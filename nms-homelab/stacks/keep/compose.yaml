services:
  keep-frontend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui
    restart: unless-stopped
    depends_on:
      - keep-backend
      - keep-websocket-server
    ports:
      - "${KEEP_BIND_IP:-10.20.60.15}:${KEEP_UI_PORT:-3200}:3000"
    environment:
      AUTH_TYPE: "DB"
      NEXTAUTH_SECRET: "${KEEP_AUTH_SECRET}"
      NEXTAUTH_URL: "http://${KEEP_BIND_IP:-10.20.60.15}:${KEEP_UI_PORT:-3200}"
      API_URL: "http://keep-backend:8080"
      NEXT_PUBLIC_API_URL: "http://${KEEP_BIND_IP:-10.20.60.15}:${KEEP_API_PORT:-8180}"
      PUSHER_HOST: "${KEEP_BIND_IP:-10.20.60.15}"
      PUSHER_PORT: "${KEEP_WS_PORT:-6101}"
      PUSHER_APP_KEY: "keepappkey"
    volumes:
      - ./state:/state
    networks:
      - keep

  keep-backend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api
    restart: unless-stopped
    ports:
      - "${KEEP_BIND_IP:-10.20.60.15}:${KEEP_API_PORT:-8180}:8080"
    environment:
      PORT: "8080"
      AUTH_TYPE: "DB"
      KEEP_JWT_SECRET: "${KEEP_AUTH_SECRET}"
      KEEP_DEFAULT_USERNAME: "${KEEP_DEFAULT_USERNAME:-tberno}"
      KEEP_DEFAULT_PASSWORD: "${KEEP_DEFAULT_PASSWORD}"
      SECRET_MANAGER_TYPE: "FILE"
      SECRET_MANAGER_DIRECTORY: "/state"
      DATABASE_CONNECTION_STRING: "sqlite:////state/db.sqlite3?check_same_thread=False"
      PUSHER_APP_ID: "1"
      PUSHER_APP_KEY: "keepappkey"
      PUSHER_APP_SECRET: "keepappsecret"
      PUSHER_HOST: "keep-websocket-server"
      PUSHER_PORT: "6001"
      USE_NGROK: "false"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus"
      KEEP_METRICS: "true"
      KEEP_API_URL: "http://${KEEP_BIND_IP:-10.20.60.15}:${KEEP_API_PORT:-8180}"
      ENVIRONMENT: "production"
    volumes:
      - ./state:/state
    networks:
      - keep

  keep-websocket-server:
    image: quay.io/soketi/soketi:1.4-16-debian
    restart: unless-stopped
    ports:
      - "${KEEP_BIND_IP:-10.20.60.15}:${KEEP_WS_PORT:-6101}:6001"
    environment:
      SOKETI_USER_AUTHENTICATION_TIMEOUT: "3000"
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "1"
      SOKETI_DEFAULT_APP_KEY: "keepappkey"
      SOKETI_DEFAULT_APP_SECRET: "keepappsecret"
    networks:
      - keep

networks:
  keep:
    driver: bridge

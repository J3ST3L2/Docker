services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=pia
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASS}
      - SERVER_REGIONS=US East
      - DOT=off
      - TZ=America/New_York
      - FIREWALL_OUTBOUND_SUBNETS=10.20.60.0/24
    volumes:
      - /opt/docker-stacks/arr-stack/config/gluetun:/gluetun
    ports:
      - "8080:8080"  # qBittorrent WebUI
      - "8989:8989"  # Sonarr
      - "7878:7878"  # Radarr
      - "9696:9696"  # Prowlarr
      - "8191:8191"  # FlareSolverr
    # network_mode omitted so this is the stack's root service

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8080
    volumes:
      - /opt/docker-stacks/arr-stack/config/qbittorrent:/config
      - /mnt/synology-store1/Autodown/Downloads:/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/docker-stacks/arr-stack/config/sonarr:/config
      - /mnt/synology-store1/Autodown/Downloads:/downloads
      - "/mnt/synology-store1/TV Shows:/tv"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/docker-stacks/arr-stack/config/radarr:/config
      - /mnt/synology-store1/Autodown/Downloads:/downloads
      - "/mnt/synology-store1/Videos:/movies"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/docker-stacks/arr-stack/config/prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York

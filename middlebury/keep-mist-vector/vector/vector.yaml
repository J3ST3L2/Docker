data_dir: /var/lib/vector

sources:
  mist_webhook:
    type: http_server
    address: 127.0.0.1:8686
    decoding:
      codec: json
    acknowledgements:
      enabled: true
    auth:
      strategy: basic
      username: "${MIST_WEBHOOK_USERNAME}"
      password: "${MIST_WEBHOOK_PASSWORD}"
    headers:
      - user-agent
      - x-mist-signature
      - x-mist-signature-v2

transforms:
  explode_mist_events:
    type: remap
    inputs:
      - mist_webhook
    drop_on_error: true
    source: |
      if exists(.events) && is_array(.events) {
        . = unnest!(.events)
      } else {
        . = [.]
      }

  normalize_mist_alert:
    type: remap
    inputs:
      - explode_mist_events
    drop_on_error: true
    source: |
      event = if exists(.events) && is_object(.events) { .events } else { . }

      topic = downcase(to_string(.topic) ?? "alarms")
      event_type = downcase(
        to_string(event.type) ??
        to_string(event.event) ??
        to_string(event.alert) ??
        to_string(event.name) ??
        "mist_alert"
      )

      state = downcase(
        to_string(event.details.state) ??
        to_string(event.state) ??
        to_string(event.status) ??
        ""
      )

      severity_raw = downcase(
        to_string(event.severity) ??
        to_string(event.level) ??
        "warning"
      )

      severity = if includes(["critical", "emergency", "fatal"], severity_raw) {
        "critical"
      } else if includes(["high", "major"], severity_raw) {
        "high"
      } else if includes(["warning", "warn", "minor"], severity_raw) {
        "warning"
      } else if includes(["low", "info", "informational"], severity_raw) {
        "low"
      } else {
        "warning"
      }

      is_resolved =
        state == "validated" ||
        state == "resolved" ||
        state == "cleared" ||
        match(event_type, r'(^|_)(reconnected|resolved|cleared|online|up)($|_)')

      status = if is_resolved { "resolved" } else { "firing" }

      device = to_string(event.device_name) ??
               to_string(event.hostname) ??
               to_string(event.ap_name) ??
               to_string(event.switch_name) ??
               to_string(event.gateway_name) ??
               to_string(event.name) ??
               "unknown-device"

      mac = downcase(
        to_string(event.mac) ??
        to_string(event.ap) ??
        to_string(event.device_mac) ??
        ""
      )

      site_id = to_string(event.site_id) ?? to_string(.site_id) ?? ""
      org_id = to_string(event.org_id) ?? to_string(.org_id) ?? ""
      site_name = to_string(event.site_name) ?? to_string(.site_name) ?? ""

      message = to_string(event.text) ??
                to_string(event.reason) ??
                to_string(event.message) ??
                event_type

      timestamp = to_string(event.timestamp) ??
                  to_string(event.time) ??
                  to_string(now())

      canonical_type = replace(
        event_type,
        r'(reconnected|resolved|cleared|online|up)',
        "down"
      )

      identity = if mac != "" { mac } else { downcase(device) }
      fingerprint = "mist:" + topic + ":" + canonical_type + ":" + identity

      . = {
        "name": device + ": " + event_type,
        "status": status,
        "severity": severity,
        "lastReceived": timestamp,
        "service": "network",
        "source": ["mist"],
        "message": message,
        "description": message,
        "fingerprint": fingerprint,
        "labels": {
          "mist_topic": topic,
          "mist_event_type": event_type,
          "mist_state": state,
          "mist_org_id": org_id,
          "mist_site_id": site_id,
          "mist_site_name": site_name,
          "mist_device": device,
          "mist_mac": mac
        }
      }

sinks:
  keep:
    type: http
    inputs:
      - normalize_mist_alert
    uri: http://127.0.0.1:8088/alerts/event
    method: post
    compression: none
    encoding:
      codec: json
    batch:
      max_events: 1
      timeout_secs: 1
    buffer:
      type: disk
      max_size: 268435456
      when_full: block
    acknowledgements:
      enabled: true
    request:
      headers:
        Content-Type: application/json
      timeout_secs: 15
      retry_attempts: 20
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 30
    healthcheck:
      enabled: false

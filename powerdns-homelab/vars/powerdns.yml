---
# Non-secret desired state for the PowerDNS HA resolver/secondary-authoritative stack.

stack:
  name: powerdns
  path: /opt/docker-stacks/powerdns-stack
  compose_file: docker-compose.yml
  runtime_env: /run/powerdns-stack.env
  token_file: /etc/1password/powerdns-stack.token
  render_script: /opt/docker-stacks/powerdns-stack/scripts/render-powerdns-env.sh

images:
  auth: powerdns/pdns-auth-50:5.0.4
  recursor: powerdns/pdns-recursor-52:5.2.9

ad_dns_primaries:
  - 10.20.60.10
  - 10.20.60.14

zones:
  internal:
    - tape.local
    - jestertek.cc

clusters:
  lab:
    - 10.20.99.39
    - 10.20.99.40
  home_prod:
    - 10.20.99.33
    - 10.20.99.34
    - 10.20.99.35
    - 10.20.99.36

secrets:
  PDNS_AUTH_API_KEY: op://JesterTek/PowerDNS/PDNS_AUTH_API_KEY
  PDNS_RECURSOR_API_KEY: op://JesterTek/PowerDNS/PDNS_RECURSOR_API_KEY

services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "${DOCKGE_PORT:-5001}:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKGE_DATA_DIR:-/opt/dockge/data}:/app/data
      - ${DOCKGE_STACKS_DIR:-/opt/docker-stacks}:${DOCKGE_STACKS_DIR:-/opt/docker-stacks}
    environment:
      - DOCKGE_STACKS_DIR=${DOCKGE_STACKS_DIR:-/opt/docker-stacks}
